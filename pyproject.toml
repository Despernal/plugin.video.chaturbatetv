[project]
name = "plugin-video-chaturbatetv"
version = "0.1.0"
description = "Standalone Chaturbate Kodi addon with TV mode"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-randomly>=3.15",
    "ruff>=0.4",
    "mypy>=1.10",
    "beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "tests/fixtures", "tests/stubs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "RUF", "S"]
ignore = [
    "S101",  # asserts are normal in tests
    "S311",  # random.choice is fine for our random tier pick (not crypto)
    "RUF012",  # mutable class defaults - dataclass fields handle this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]

[tool.mypy]
strict = true
mypy_path = "tests/stubs"
files = ["resources/lib"]
